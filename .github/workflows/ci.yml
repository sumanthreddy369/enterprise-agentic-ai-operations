name: foundation-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --frozen --python 3.11
      - run: uv run python scripts/check_repository.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src apps
      - run: uv run pytest -q -m "not integration"
      - run: uv run alembic upgrade head
      - run: uv run alembic check
  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv sync --frozen --python 3.11
      - run: uv run python scripts/init_local.py
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: docker compose up -d --wait postgres opensearch
      - run: uv run python scripts/run_integration.py
      - run: docker compose build api
      - name: Container API smoke test
        run: |
          docker compose up -d --wait api
          curl --fail http://localhost:8000/ready
      - if: always()
        run: docker compose down
