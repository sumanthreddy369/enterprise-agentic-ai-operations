[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agentic-ai-operations"
version = "0.1.0"
description = "Provenance-preserving enterprise incident data foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1", "pandas>=2.2,<3", "polars>=1.20,<2", "pyarrow>=19,<25",
  "tenacity>=9,<10", "defusedxml>=0.7,<1", "filelock>=3.16,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "pandas-stubs", "types-defusedxml"]

[project.scripts]
ops-data = "src.ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "apps"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
untyped_calls_exclude = ["pyarrow"]
exclude = ["infrastructure/migrations/versions"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires running PostgreSQL and OpenSearch"]
